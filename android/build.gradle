buildscript {
  ext.WifiAware = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 37,
    compileSdkMinorVersion: 2
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return WifiAware[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.3"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.wifiaware"

  // Stage 9 calls public Android 37.2 APIs. A consuming app can set a newer
  // target, but it cannot compile this native source against an older SDK.
  compileSdkVersion WifiAware.compileSdkVersion
  compileSdkMinor WifiAware.compileSdkMinorVersion

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  testImplementation "junit:junit:4.13.2"
}
